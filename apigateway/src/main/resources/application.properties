spring.application.name=api-gateway
server.port=8080
spring.cloud.gateway.server.webflux.routes[0].id=kunden-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://kundenservice.railway.internal:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/kunden/**
spring.cloud.gateway.server.webflux.routes[1].id=bestellung-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://bestellungservice.railway.internal:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/bestellungen/**