spring.application.name=api-gateway
server.port=8080

spring.cloud.gateway.server.webflux.routes[0].id=customer-service
spring.cloud.gateway.server.webflux.routes[0].uri=${CUSTOMER_SERVICE_URL:http://customer-service:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/customers/**

spring.cloud.gateway.server.webflux.routes[1].id=order-service
spring.cloud.gateway.server.webflux.routes[1].uri=${ORDER_SERVICE_URL:http://order-service:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.server.webflux.routes[2].id=auth-service
spring.cloud.gateway.server.webflux.routes[2].uri=${AUTH_SERVICE_URL:http://auth-service:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[3].id=auth-service-users
spring.cloud.gateway.server.webflux.routes[3].uri=${AUTH_SERVICE_URL:http://auth-service:8083}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/users/**

spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*

jwt.secret=${JWT_SECRET}