spring.application.name=api-gateway
server.port=8080
spring.cloud.gateway.server.webflux.routes[0].id=customer-service
spring.cloud.gateway.server.webflux.routes[0].uri=https://customer-service-app.up.railway.app
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/customers/**
spring.cloud.gateway.server.webflux.routes[1].id=order-service
spring.cloud.gateway.server.webflux.routes[1].uri=https://orderservice-api.up.railway.app
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/orders/**