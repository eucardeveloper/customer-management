spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
app.kafka.listener.auto-startup=false
# H2 tests build the schema with Hibernate; the PostgreSQL migrations run only in the Testcontainers test
spring.flyway.enabled=false
# Tests send identity headers without the gateway secret; a real start-up without GATEWAY_SHARED_SECRET fails.
gateway.allow-unsigned-headers=true
