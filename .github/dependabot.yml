version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend/customer-app
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # Major upgrades (framework migrations) are deliberate work with their own testing, not a bot's weekly PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend/ai-agent-app
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
