name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  auth-service:
    name: Auth Service Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('auth-service/pom.xml') }}
      - name: Run Auth Service Tests
        run: mvn test --no-transfer-progress
        working-directory: auth-service

  api-gateway:
    name: API Gateway Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('apigateway/pom.xml') }}
      - name: Run API Gateway Tests
        run: mvn test --no-transfer-progress
        working-directory: apigateway

  customer-service:
    name: Customer Service Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('customer-service/pom.xml') }}
      - name: Run Customer Service Tests
        run: mvn test --no-transfer-progress
        working-directory: customer-service

  order-service:
    name: Order Service Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('order-service/pom.xml') }}
      - name: Run Order Service Tests
        run: mvn test --no-transfer-progress
        working-directory: order-service

  monitoring:
    name: Prometheus config and alert rule tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: promtool check config, then unit-test the alert rules
        # same image and version as docker-compose.yml
        run: |
          docker run --rm -v "$PWD/monitoring:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v3.15.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/monitoring:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v3.15.0 \
            test rules /etc/prometheus/alerts.test.yml
      - name: Grafana dashboard is valid JSON
        run: python3 -m json.tool monitoring/grafana/dashboards/overview.json > /dev/null
