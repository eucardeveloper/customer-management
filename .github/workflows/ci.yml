name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  auth-service:
    name: Auth Service Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('auth-service/pom.xml') }}
      - name: Run Auth Service Tests
        run: mvn test --no-transfer-progress
        working-directory: auth-service
      - name: JaCoCo summary (auth-service)
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv
          mi = ci = mb = cb = 0
          for r in csv.DictReader(open("target/site/jacoco/jacoco.csv")):
              mi += int(r["INSTRUCTION_MISSED"]); ci += int(r["INSTRUCTION_COVERED"])
              mb += int(r["BRANCH_MISSED"]); cb += int(r["BRANCH_COVERED"])
          print("### JaCoCo (auth-service)")
          print(f"- Instructions: {100*ci/(ci+mi):.1f}% ({ci}/{ci+mi})")
          print(f"- Branches: {100*cb/(cb+mb):.1f}% ({cb}/{cb+mb})")
          PY
          else
            echo "JaCoCo report not found (auth-service)" >> "$GITHUB_STEP_SUMMARY"
          fi
        working-directory: auth-service

