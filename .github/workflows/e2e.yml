name: E2E

# Boots the whole compose stack (Kafka, three databases, gateway, frontends) and drives it with
# Playwright: sign-in, role limits, session revocation, delete integrity. It takes several minutes, so
# a newer push to the same branch cancels the run that is still going.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from the example
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^GATEWAY_SHARED_SECRET=.*|GATEWAY_SHARED_SECRET=$(openssl rand -hex 32)|" .env
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the gateway
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/customers || true)
            [ "$code" = "401" ] && exit 0
            sleep 5
          done
          docker compose logs --tail=100
          exit 1
      - name: Wait for the customer frontend
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/login || true)
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          docker compose logs --tail=100 customer-frontend
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and run Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
