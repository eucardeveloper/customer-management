name: E2E

# Boots the whole compose stack (Kafka, three databases, gateway, frontends) and drives it with
# Playwright: sign-in, role limits, session revocation, delete integrity, adding a user. Then proves a
# backup of the three databases can be restored. It takes several minutes, so
# a newer push to the same branch cancels the run that is still going.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Create .env from the example
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^GATEWAY_SHARED_SECRET=.*|GATEWAY_SHARED_SECRET=$(openssl rand -hex 32)|" .env
      - name: Start the stack
        # Only what the journey needs. n8n, Grafana, Prometheus and the AI agent UI are not exercised and
        # together with the rest they would not fit in a hosted runner's ~7 GB.
        run: |
          docker compose up -d --build auth-backend customer-backend order-backend api-gateway customer-frontend
          docker compose ps
      - name: Wait until the whole stack really answers
        # A 401 from the gateway only proves the gateway is up. Sign in and read the lists from the
        # customer- and order-service, and load the login page, so the tests never start on a half-started stack.
        run: |
          echo '{"username":"admin","password":"admin123"}' > login.json
          ready() {
            token=$(curl -s -i -H 'Content-Type: application/json' --data @login.json http://localhost:8080/api/auth/login \
              | grep -i '^set-cookie: customer_session=' | sed -E 's/.*customer_session=([^;]+).*/\1/')
            [ -n "$token" ] || return 1
            for path in /api/customers /api/orders /api/users; do
              [ "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" "http://localhost:8080$path")" = "200" ] || return 1
            done
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login)" = "200" ]
          }
          for i in $(seq 1 90); do
            ready && exit 0
            # say what is missing, so a failed run explains itself
            echo "attempt $i: not ready yet ($(docker compose ps --format '{{.Service}}={{.Status}}' | tr '\n' ' '))"
            sleep 5
          done
          echo "--- memory"; free -m
          echo "--- containers"; docker compose ps -a
          echo "--- last log lines"; docker compose logs --tail=60
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install and run Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Show why a test failed
        # The run log cannot be read without signing in; annotations can, so each failure is printed as one.
        if: failure()
        working-directory: e2e
        run: |
          node -e "
          const fs=require('fs');
          if(!fs.existsSync('test-results/results.json')){console.log('::error::no Playwright results file');process.exit(0)}
          const r=JSON.parse(fs.readFileSync('test-results/results.json','utf8'));
          const walk=(s)=>{for(const t of (s.specs||[]))for(const x of t.tests)for(const res of x.results)if(res.status!=='passed'&&res.status!=='skipped'){const m=((res.error&&res.error.message)||'').replace(/\\x1b\\[[0-9;]*m/g,'').slice(0,900).replace(/\n/g,'%0A');console.log('::error title='+t.title.slice(0,80)+'::'+m)} for(const c of (s.suites||[]))walk(c)};
          for(const s of r.suites)walk(s);"
      - name: Backup and restore test (all three databases)
        # Runs after the journey, on the data it left behind: dump, change a row in each database, restore,
        # check every change is gone and every row count matches the backup.
        run: ./restore-test.sh
      - name: Runtime database roles are restricted
        # After the restore too: the services run as *_app (rows only), the owner built and restored the schema.
        run: |
          for p in auth customer order; do
            t=$(case $p in auth) echo users;; customer) echo customer;; order) echo orders;; esac)
            q() { docker compose exec -T -e PGPASSWORD=runtime-db-123 "$p-db" psql -v ON_ERROR_STOP=1 -U "${p}_app" -d "${p}_db" -tA -c "$1"; }
            [ "$(q 'SELECT rolsuper OR rolcreatedb OR rolcreaterole FROM pg_roles WHERE rolname = current_user')" = "f" ]
            [ "$(q "SELECT count(*) > 0 FROM $t")" = "t" ]
            if q 'CREATE TABLE should_fail(id int)' 2>/dev/null; then echo "$p: runtime role could create a table"; exit 1; fi
            if q "DROP TABLE $t" 2>/dev/null; then echo "$p: runtime role could drop a table"; exit 1; fi
            if q "ALTER TABLE $t ADD COLUMN x int" 2>/dev/null; then echo "$p: runtime role could alter a table"; exit 1; fi
          done
          echo "least-privilege roles verified"
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
