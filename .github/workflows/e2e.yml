name: E2E (manual)

# Boots the whole compose stack and drives it with Playwright. Manual on purpose: it needs the full
# stack (Kafka, three databases) and several minutes, so it is run before releases, not on every push.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from the example
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the gateway
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/customers || true)
            [ "$code" = "401" ] && exit 0
            sleep 5
          done
          docker compose logs --tail=100
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and run Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
