name: Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# No path filter on purpose: a required check that is skipped by a filter never reports and blocks the merge.
# The two jobs below can therefore be listed as required status checks in the branch ruleset.

jobs:
  frontend:
    name: ${{ matrix.app }} - lint, test, build, audit
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [customer-app, ai-agent-app]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Unit tests
        run: npm test --if-present
      - run: npm run build
      - name: Known vulnerabilities in production dependencies (high and above)
        run: npm audit --omit=dev --audit-level=high
