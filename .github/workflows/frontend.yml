name: Frontend

on:
  push:
    branches: ["**"]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

jobs:
  frontend:
    name: ${{ matrix.app }} - lint, test, build, audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer-app, ai-agent-app]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Unit tests
        run: npm test --if-present
      - run: npm run build
      - name: Known vulnerabilities in production dependencies (high and above)
        run: npm audit --omit=dev --audit-level=high
