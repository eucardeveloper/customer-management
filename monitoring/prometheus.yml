global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules; unit-tested with `promtool test rules alerts.test.yml` (CI job "monitoring").
# There is no Alertmanager in this stack: firing alerts are visible under Alerts in the Prometheus UI.
rule_files:
  - alerts.yml

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:9091']   # management port, not published to the host

  - job_name: 'auth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['auth-backend:8083']

  - job_name: 'customer-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['customer-backend:8081']

  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['order-backend:8082']
