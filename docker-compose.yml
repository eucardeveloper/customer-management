# Only the entry points a browser needs are published to the host:
#   gateway 8080, frontends 3000/3001, n8n 5678, prometheus 9090, grafana 3002.
# Databases, Kafka and the three backends are reachable only inside the compose network.
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 45s

  auth-db:
    image: postgres:16
    container_name: auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  customer-db:
    image: postgres:16
    container_name: customer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-postgres123}
    volumes:
      - customer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-db:
    image: postgres:16
    container_name: order-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-postgres123}
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-backend:
    build: ./auth-service
    container_name: auth-backend
    restart: unless-stopped
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/auth_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (copy .env.example)}
      JWT_EXPIRATION: 86400000

  customer-backend:
    build: ./customer-service
    container_name: customer-backend
    restart: unless-stopped
    depends_on:
      customer-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      PORT: 8081
      DATABASE_URL: jdbc:postgresql://customer-db:5432/customer_db
      PGUSER: postgres
      PGPASSWORD: ${APP_DB_PASSWORD:-postgres123}
      KAFKACLUSTER_BROKERS: kafka:29092

  order-backend:
    build: ./order-service
    container_name: order-backend
    restart: unless-stopped
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/order_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-postgres123}
      KAFKA_URL: kafka:29092

  api-gateway:
    build: ./apigateway
    container_name: api-gateway
    restart: unless-stopped
    depends_on:
      - auth-backend
      - customer-backend
      - order-backend
    ports:
      - "8080:8080"
    environment:
      CUSTOMER_SERVICE_URL: http://customer-backend:8081
      ORDER_SERVICE_URL: http://order-backend:8082
      AUTH_SERVICE_URL: http://auth-backend:8083
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (copy .env.example)}

  customer-frontend:
    build:
      context: ./frontend/customer-app
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: customer-frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - "3000:3000"
    environment:
      # Server-side only. The key is never exposed to the browser bundle.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      API_INTERNAL_URL: http://api-gateway:8080

  ai-agent-frontend:
    build: ./frontend/ai-agent-app
    container_name: ai-agent-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_N8N_URL: http://localhost:5678

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_PORT: 5678
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: customer-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: customer_db
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: ${APP_DB_PASSWORD:-postgres123}
    depends_on:
      customer-db:
        condition: service_healthy
    volumes:
      - n8n-data:/home/node/.n8n


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    depends_on:
      - auth-backend
      - customer-backend
      - order-backend

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  prometheus-data:
  customer-db-data:
  order-db-data:
  auth-db-data:
  n8n-data:
  grafana-data: